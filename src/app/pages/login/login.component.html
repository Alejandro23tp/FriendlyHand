<section class="h-screen flex items-center justify-center bg-black-color-450 px-4 relative overflow-hidden">
    <!-- Elementos decorativos de fondo -->
    <div class="absolute inset-0 overflow-hidden">
        <!-- Gradiente de fondo -->
        <div class="absolute inset-0 bg-gradient-to-br from-black-color-800 via-black-color-900 to-black-color-950"></div>
        
        <!-- Círculos y formas con gradientes -->
        <div class="absolute top-0 left-0 w-96 h-96 bg-gradient-to-r from-primary-500/10 to-celeste-color-400/10 rounded-full filter blur-3xl opacity-20 transform -translate-x-1/2 -translate-y-1/2"></div>
        <div class="absolute bottom-0 right-0 w-96 h-96 bg-gradient-to-l from-primary-500/10 to-purple-500/10 rounded-full filter blur-3xl opacity-20 transform translate-x-1/2 translate-y-1/2"></div>
        
        <!-- Grid pattern -->
        <div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iNjAiIGhlaWdodD0iNjAiIHZpZXdCb3g9IjAgMCA2MCA2MCIgeG1sbnM9Imh0dHA6Ly93d3cudzMub3JnLzIwMDAvc3ZnIj48ZyBmaWxsPSJub25lIiBmaWxsLXJ1bGU9ImV2ZW5vZGQiPjxnIGZpbGw9IiMyMDIwMjAiIGZpbGwtb3BhY2l0eT0iMC4yIj48cGF0aCBkPSJNMzYgMzRoLTJ2LTRoMnY0em0wLTZoLTJ2LTRoMnY0em0wLTZoLTJ2LTRoMnY0em0wLTZoLTJWNmgydjR6bTAgMzBoLTJ2LTRoMnY0em0wLTZoLTJ2LTRoMnY0eiIvPjwvZz48L2c+PC9zdmc+')] opacity-30"></div>
        
        <!-- Líneas decorativas angulares -->
        <div class="absolute top-0 left-0 w-full h-full" aria-hidden="true">
            <div class="absolute top-1/4 left-0 w-full h-px bg-gradient-to-r from-transparent via-primary-500/20 to-transparent transform -rotate-2"></div>
            <div class="absolute top-1/3 left-0 w-full h-px bg-gradient-to-r from-transparent via-celeste-color-400/20 to-transparent transform rotate-2"></div>
            <div class="absolute top-2/3 left-0 w-full h-px bg-gradient-to-r from-transparent via-primary-500/20 to-transparent transform -rotate-1"></div>
        </div>
        
        <!-- Puntos brillantes -->
        <div class="absolute top-1/4 left-1/4 w-1 h-1 bg-primary-500/60 rounded-full"></div>
        <div class="absolute top-1/3 right-1/4 w-1 h-1 bg-celeste-color-400/60 rounded-full"></div>
        <div class="absolute bottom-1/4 left-1/3 w-1 h-1 bg-primary-500/60 rounded-full"></div>
        <div class="absolute top-2/3 right-1/3 w-1 h-1 bg-celeste-color-400/60 rounded-full"></div>
        <div class="absolute bottom-1/3 right-1/5 w-1 h-1 bg-primary-500/60 rounded-full"></div>
             <!-- Puntos brillantes adicionales -->
        <div class="absolute bottom-1/12 left-1/4 w-1 h-1 bg-primary-500/50 rounded-full"></div>
        <div class="absolute bottom-1/6 right-1/3 w-0.5 h-0.5 bg-celeste-color-400/40 rounded-full"></div>
        <div class="absolute bottom-1/5 left-1/2 w-1 h-1 bg-primary-500/40 rounded-full"></div>
        <div class="absolute bottom-1/4 right-1/4 w-0.5 h-0.5 bg-celeste-color-400/50 rounded-full"></div>
        <div class="absolute bottom-1/3 left-1/6 w-1.5 h-1.5 bg-primary-500/30 rounded-full"></div>
        <div class="absolute bottom-2/5 right-2/5 w-1 h-1 bg-celeste-color-400/40 rounded-full"></div>
        <div class="absolute bottom-[10%] left-[45%] w-0.5 h-0.5 bg-primary-500/50 rounded-full"></div>
        <div class="absolute bottom-[15%] right-[35%] w-1 h-1 bg-celeste-color-400/40 rounded-full"></div>
        <div class="absolute bottom-[8%] left-[75%] w-0.5 h-0.5 bg-primary-500/50 rounded-full"></div>
        <div class="absolute bottom-[12%] right-[15%] w-1 h-1 bg-celeste-color-400/30 rounded-full"></div>
    </div>

    <div class="w-full max-w-md relative z-10">
        <!-- Card con efecto glassmorphism -->
        <div class="bg-gradient-to-br from-black-color-800/90 to-black-color-900/90 rounded-2xl p-6 border border-primary-500/20 shadow-xl shadow-primary-500/10 backdrop-blur-md">
            <!-- Header y logo -->
            <div class="text-center mb-6">
                <div class="mb-4 transform hover:scale-105 transition-all duration-300">
                    <img src="images/logomp.svg" class="w-40 mx-auto" alt="Logo">
                </div>
                
                <h1 class="text-white font-bold text-3xl mb-2 bg-gradient-to-r from-primary-400 to-celeste-color-400 bg-clip-text text-transparent">Bienvenido</h1>
                <p class="text-primary-200 font-medium">Inicia sesión para continuar</p>
            </div>
            
            <!-- Formulario de inicio de sesión -->
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
                <!-- Usuario -->
                <div class="mb-6">
                    <label for="usr_usuario" class="block text-primary-200 font-medium mb-2">Usuario</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-primary-500 transition-colors group-hover:text-primary-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                        </div>
                        <input 
                            type="text" 
                            id="usr_usuario" 
                            class="w-full p-4 pl-12 bg-black-color-900/70 text-white border border-primary-500/30 rounded-xl focus:border-primary-500 focus:ring-2 focus:ring-primary-500/50 transition-all outline-none"
                            placeholder="Introduce tu usuario" 
                            formControlName="usr_usuario">
                    </div>
                </div>
                
                <!-- Contraseña -->
                <div class="mb-6">
                    <label for="password" class="block text-primary-200 font-medium mb-2">Contraseña</label>
                    <div class="relative group">
                        <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                            <svg class="h-5 w-5 text-primary-500 transition-colors group-hover:text-primary-400" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
                            </svg>
                        </div>
                        <input 
                            type="password" 
                            id="password" 
                            class="w-full p-4 pl-12 bg-black-color-900/70 text-white border border-primary-500/30 rounded-xl focus:border-primary-500 focus:ring-2 focus:ring-primary-500/50 transition-all outline-none"
                            placeholder="Introduce tu contraseña" 
                            formControlName="password">
                    </div>
                </div>
                
                <!-- Recordarme -->
                <div class="mb-6 flex items-center">
                    <div class="relative inline-block w-10 mr-2 align-middle select-none">
                        <input 
                            type="checkbox" 
                            id="rememberMe" 
                            class="opacity-0 absolute block w-6 h-6 cursor-pointer" 
                            formControlName="rememberMe">
                        <label 
                            for="rememberMe" 
                            class="toggle-label block overflow-hidden h-6 rounded-full bg-black-color-700 cursor-pointer items-center">
                            <span class="toggle-dot block absolute left-1 top-1 w-4 h-4 rounded-full bg-white shadow transform transition-transform duration-300 ease-in-out"></span>
                        </label>
                    </div>
                    <label for="rememberMe" class="text-primary-200">Recordarme</label>
                </div>
                
                <!-- Botón de inicio de sesión -->
                <div class="mb-6">
                    <button 
                        type="submit" 
                        class="w-full p-4 bg-gradient-to-r from-celeste-color-600 to-primary-500 text-black font-medium rounded-xl hover:opacity-90 transition duration-300 ease-in-out shadow-lg shadow-primary-500/20 transform hover:-translate-y-1" 
                        [disabled]="isLoading">
                        <span *ngIf="!isLoading">Iniciar sesión</span>
                        <span *ngIf="isLoading" class="flex items-center justify-center">
                            <svg class="animate-spin h-5 w-5 mr-3" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            Cargando...
                        </span>
                    </button>
                </div>
                
                <!-- Registro -->
                <div class="text-center text-sm">
                    <p class="text-primary-200">
                        ¿No tienes una cuenta? 
                        <a href="#" class="text-primary-400 hover:text-primary-300 font-medium transition-colors">Regístrate</a>
                    </p>
                </div>
            </form>
        </div>
    </div>
</section>
