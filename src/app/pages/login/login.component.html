<section class="h-screen flex items-center justify-center bg-black px-4 relative overflow-hidden">
<!-- Botón de cambio mejorado -->
<button (click)="toggleLoginView()"
        class="absolute top-4 right-4 flex items-center gap-2 bg-black/70 backdrop-blur-sm border {{ isAdminView ? 'border-citron-500/30 hover:border-citron-400' : 'border-primary-500/30 hover:border-primary-400' }} text-white font-medium px-4 py-2 rounded-full shadow-lg hover:shadow-xl transition-all duration-300 ease-in-out group">
  
  <!-- Icono dinámico -->
  <span class="relative w-5 h-5 flex items-center justify-center">
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         [class.opacity-100]="!isAdminView" [class.opacity-0]="isAdminView" [class.rotate-180]="isAdminView"
         class="absolute transition-all duration-300">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
    </svg>
    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
         [class.opacity-100]="isAdminView" [class.opacity-0]="!isAdminView" [class.rotate-180]="!isAdminView"
         class="absolute transition-all duration-300">
      <path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path>
      <circle cx="12" cy="7" r="4"></circle>
      <path d="M16 3v4"></path>
      <path d="M8 3v4"></path>
      <path d="M3 7h18"></path>
    </svg>
  </span>
  
  <span class="transition-all duration-300">
    {{ isAdminView ? 'Modo Participante' : 'Modo Admin' }}
  </span>
  
  <span class="group-hover:translate-x-1 transition-transform duration-200">
    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M5 12h14M12 5l7 7-7 7"></path>
    </svg>
  </span>
</button>
  
    <div class="w-full max-w-md relative z-10 perspective h-[500px]">
      <!-- Card con efecto de giro -->
      <div [class.rotate]="isAdminView"
           class="relative w-full h-full duration-700 transform-style preserve-3d transition-transform">
  
        <!-- Cara Cliente -->
        <div class="absolute inset-0 backface-hidden h-full">
          <div class="h-full bg-gradient-to-br from-black-color-800/90 to-black-color-900/90 rounded-2xl p-6 border border-primary-500/20 shadow-xl shadow-primary-500/10 backdrop-blur-md flex flex-col justify-center">
            <!-- Logo -->
            <img src="images/logomp.svg" class="w-40 mx-auto" alt="Logo">
  
            <!-- Texto -->
            <div class="text-center mb-4">
              <h1 class="text-white font-bold text-3xl mb-2 bg-gradient-to-r from-primary-400 to-celeste-color-400 bg-clip-text text-transparent">Bienvenido</h1>
              <p class="text-primary-200 font-medium">Participante</p>
            </div>
  
            <!-- Formulario -->
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
              <app-login-fields [parentForm]="loginForm" [isAdminView]="false" [formPrefix]="'participant_'"></app-login-fields>
            </form>
          </div>
        </div>
  
        <!-- Cara Admin -->
        <div class="absolute inset-0 backface-hidden rotateY-180 h-full">
          <div class="h-full bg-gradient-to-br from-black-color-800/90 to-black-color-900/90 rounded-2xl p-6 border border-citron-500/20 shadow-xl shadow-citron-500/10 backdrop-blur-md flex flex-col justify-center">
            <!-- Logo -->
            <img src="images/logodorado.svg" class="w-40 mx-auto mb-4" alt="Logo">
  
            <!-- Texto -->
            <div class="text-center mb-4">
              <h1 class="text-white font-bold text-3xl mb-2 bg-gradient-to-r from-citron-400 to-amber-400 bg-clip-text text-transparent">Bienvenido</h1>
              <p class="text-citron-200 font-medium">Administrador</p>
            </div>
  
            <!-- Formulario -->
            <form [formGroup]="loginForm" (ngSubmit)="onLogin()">
              <app-login-fields [parentForm]="loginForm" [isAdminView]="true" [formPrefix]="'admin_'"></app-login-fields>
            </form>
          </div>
        </div>
      </div>
    </div>
  </section>
